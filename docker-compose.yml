services:
  shortener:
    image: ghcr.io/collinesfilms/shortify:latest
    container_name: shortener
    restart: unless-stopped
    ports:
      # Point your reverse proxy at this port.
      - "9018:8080"
    volumes:
      # Create the directory and give it to the container before the first run:
      #   mkdir -p data && sudo chown -R 10001:10001 data
      - ./data:/data
    env_file:
      - .env
